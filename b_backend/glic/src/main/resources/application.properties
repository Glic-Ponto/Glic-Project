spring.application.name=glic
server.port=8080

# Ponte API <-> MySQL Local (Porta 3306, Banco 'glic')
spring.datasource.url=${GLIC_DATABASE_URL:jdbc:mysql://localhost:3306/glic?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${GLIC_DATABASE_USER:root}
spring.datasource.password=${GLIC_DATABASE_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracao do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracao do Swagger (SpringDoc OpenAPI)
springdoc.swagger-ui.path=/swagger-ui.html