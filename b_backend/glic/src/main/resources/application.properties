spring.application.name=glic
server.port=8080

# Configuracao do Banco de Dados H2 (Em Memoria para Testes)
spring.datasource.url=jdbc:h2:mem:glicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracao do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracao do Swagger (SpringDoc OpenAPI)
springdoc.swagger-ui.path=/swagger-ui.html

# Caso queira utilizar MySQL local futuramente, basta descomentar abaixo e comentar o H2:
# spring.datasource.url=jdbc:mysql://localhost:3306/glic?createDatabaseIfNotExist=true
