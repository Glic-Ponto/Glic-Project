spring.application.name=glic
server.port=8080

# Banco H2 local persistente. Testes sobrescrevem esta URL com banco em memoria.
spring.datasource.url=${GLIC_DATABASE_URL:jdbc:h2:file:./data/glicdb;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracao do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracao do Swagger (SpringDoc OpenAPI)
springdoc.swagger-ui.path=/swagger-ui.html

# Caso queira utilizar MySQL local futuramente, basta descomentar abaixo e comentar o H2:
